plugins {
    id 'com.android.application'
}

android {
    namespace 'com.biteandbrew.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.biteandbrew.pos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // Release signing comes from environment variables so no secret is stored in the project.
    signingConfigs {
        release {
            if (System.getenv('BB_KEYSTORE')) {
                storeFile file(System.getenv('BB_KEYSTORE'))
                storePassword System.getenv('BB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BB_KEY_ALIAS') ?: 'bitebrew'
                keyPassword System.getenv('BB_KEY_PASSWORD') ?: System.getenv('BB_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('BB_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
